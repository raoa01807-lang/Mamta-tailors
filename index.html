<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Tactical Shooter with Joystick & Crosshair</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
            font-family: Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        canvas {
            display: block;
        }
        /* HUD (Heads-Up Display) */
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
            box-sizing: border-box;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .minimap {
            width: 90px;
            height: 90px;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            position: relative;
        }
        .minimap-player {
            width: 8px;
            height: 8px;
            background: #00ffcc;
            position: absolute;
            top: 41px;
            left: 41px;
            border-radius: 50%;
        }
        .match-info {
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 15px;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            display: flex;
            gap: 15px;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .score-blue { color: #3498db; }
        .score-red { color: #e74c3c; }
        .timer { font-size: 16px; letter-spacing: 1px; }

        /* Center Aim Crosshair */
        .crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            pointer-events: none;
        }
        .crosshair::before, .crosshair::after {
            content: '';
            position: absolute;
            background: rgba(0, 255, 204, 0.8);
        }
        .crosshair::before {
            top: 9px; left: 0; width: 20px; height: 2px;
        }
        .crosshair::after {
            top: 0; left: 9px; width: 2px; height: 20px;
        }

        .bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            pointer-events: auto;
        }
        .weapon-panel {
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #e67e22;
            padding: 10px;
            border-radius: 10px;
            color: white;
            text-align: center;
            width: 130px;
        }
        .weapon-name { font-size: 12px; color: #f1c40f; font-weight: bold; }
        .ammo-count { font-size: 20px; font-weight: bold; margin-top: 4px; }
        
        .action-buttons {
            display: flex;
            gap: 10px;
        }
        .btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid white;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            pointer-events: auto;
        }
        .btn:active {
            background: rgba(255, 255, 255, 0.5);
        }
        .btn-shoot {
            background: rgba(231, 76, 60, 0.8);
            border-color: #c0392b;
        }

        /* Virtual Joystick CSS */
        #joystick-container {
            position: absolute;
            bottom: 90px;
            left: 30px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            pointer-events: auto;
            touch-action: none;
            display: none; /* Mobile par apne aap visible ho jayega */
        }
        #joystick-knob {
            position: absolute;
            top: 35px;
            left: 35px;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            pointer-events: none;
        }
    </style>
    <!-- Three.js Library Load -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="hud">
        <div class="top-bar">
            <div class="minimap">
                <div class="minimap-player"></div>
            </div>
            <div class="match-info">
                <span class="score-blue">0</span>
                <span class="timer">00:45</span>
                <span class="score-red">2</span>
            </div>
        </div>

        <!-- Aiming Crosshair in Center -->
        <div class="crosshair"></div>

        <div class="bottom-bar">
            <div class="weapon-panel">
                <div class="weapon-name">AK-47</div>
                <div class="ammo-count">30 / 120</div>
            </div>
            <div class="action-buttons">
                <button class="btn" onclick="reloadWeapon()">Reload</button>
                <button class="btn btn-shoot" onclick="shootBullet()">FIRE</button>
            </div>
        </div>
    </div>

    <!-- Virtual Joystick HTML -->
    <div id="joystick-container">
        <div id="joystick-knob"></div>
    </div>

    <script>
        let scene, camera, renderer;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let ammo = 30;
        let rotationX = 0, rotationY = 0;

        // Joystick variables
        let joystickActive = false;
        let joystickData = { x: 0, y: 0 };

        function init() {
            // 1. Scene setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a24);
            scene.fog = new THREE.FogExp2(0x1a1a24, 0.03);

            // 2. Camera setup
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 3, 5);

            // 3. Renderer setup
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // 4. Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(10, 20, 10);
            scene.add(directionalLight);

            // 5. Environment (Ground & Tactical Obstacles)
            const floorGeo = new THREE.PlaneGeometry(100, 100);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x33333d, roughness: 0.8 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            const boxGeo = new THREE.BoxGeometry(3, 4, 3);
            const boxMat = new THREE.MeshStandardMaterial({ color: 0x555d6e });
            for (let i = 0; i < 6; i++) {
                const box = new THREE.Mesh(boxGeo, boxMat);
                box.position.set((Math.random() - 0.5) * 30, 2, (Math.random() - 0.5) * 30);
                scene.add(box);
            }

            createEnemy(-5, 1, -10);
            createEnemy(8, 1, -15);

            // Check if touch device to show joystick
            if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
                document.getElementById('joystick-container').style.display = 'block';
                setupJoystick();
            }

            // Event Listeners
            window.addEventListener('resize', onWindowResize, false);
            document.addEventListener('keydown', onKeyDown, false);
            document.addEventListener('keyup', onKeyUp, false);
            
            // Mouse Drag to Look Around (Aiming)
            let isDragging = false;
            let previousMousePosition = { x: 0, y: 0 };

            document.addEventListener('mousedown', (e) => {
                if(e.target.tagName !== 'BUTTON') {
                    isDragging = true;
                    previousMousePosition = { x: e.clientX, y: e.clientY };
                }
            });

            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                const deltaX = e.clientX - previousMousePosition.x;
                const deltaY = e.clientY - previousMousePosition.y;

                rotationY -= deltaX * 0.003;
                rotationX -= deltaY * 0.003;
                rotationX = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, rotationX));

                camera.rotation.order = 'YXZ';
                camera.rotation.y = rotationY;
                camera.rotation.x = rotationX;

                previousMousePosition = { x: e.clientX, y: e.clientY };
            });

            document.addEventListener('mouseup', () => { isDragging = false; });

            animate();
        }

        function createEnemy(x, y, z) {
            const enemyGeo = new THREE.BoxGeometry(1.2, 2.5, 0.8);
            const enemyMat = new THREE.MeshStandardMaterial({ color: 0xe74c3c });
            const enemy = new THREE.Mesh(enemyGeo, enemyMat);
            enemy.position.set(x, y, z);
            scene.add(enemy);
        }

        // Virtual Joystick Logic for Mobile Movement
        function setupJoystick() {
            const container = document.getElementById('joystick-container');
            const knob = document.getElementById('joystick-knob');
            const rect = container.getBoundingClientRect();
            const center = { x: rect.width / 2, y: rect.height / 2 };

            container.addEventListener('touchstart', (e) => { joystickActive = true; });
            container.addEventListener('touchmove', (e) => {
                if (!joystickActive) return;
                const touch = e.targetTouches[0];
                const x = touch.clientX - rect.left - center.x;
                const y = touch.clientY - rect.top - center.y;
                const distance = Math.min(50, Math.sqrt(x * x + y * y));
                const angle = Math.atan2(y, x);

                const knobX = Math.cos(angle) * distance;
                const knobY = Math.sin(angle) * distance;
                knob.style.transform = `translate(${knobX}px, ${knobY}px)`;

                joystickData.x = knobX / 50;
                joystickData.y = knobY / 50;
            });

            container.addEventListener('touchend', () => {
                joystickActive = false;
                joystickData = { x: 0, y: 0 };
                knob.style.transform = `translate(0px, 0px)`;
            });
        }

        function shootBullet() {
            if (ammo > 0) {
                ammo--;
                document.querySelector('.ammo-count').innerText = `${ammo} / 120`;
                camera.position.y += 0.05;
                setTimeout(() => camera.position.y -= 0.05, 50);
            } else {
                reloadWeapon();
            }
        }

        function reloadWeapon() {
            document.querySelector('.ammo-count').innerText = "Reloading...";
            setTimeout(() => {
                ammo = 30;
                document.querySelector('.ammo-count').innerText = `${ammo} / 120`;
            }, 1000);
        }

        function onKeyDown(event) {
            switch (event.code) {
                case 'KeyW': moveForward = true; break;
                case 'KeyS': moveBackward = true; break;
                case 'KeyA': moveLeft = true; break;
                case 'KeyD': moveRight = true; break;
            }
        }

        function onKeyUp(event) {
            switch (event.code) {
                case 'KeyW': moveForward = false; break;
                case 'KeyS': moveBackward = false; break;
                case 'KeyA': moveLeft = false; break;
                case 'KeyD': moveRight = false; break;
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Main Animation Loop
        function animate() {
            requestAnimationFrame(animate);

            const speed = 0.1;
            
            // Keyboard Movement
            if (moveForward) camera.translateZ(-speed);
            if (moveBackward) camera.translateZ(speed);
            if (moveLeft) camera.translateX(-speed);
            if (moveRight) camera.translateX(speed);

            // Joystick Movement (Mobile)
            if (joystickActive) {
                camera.position.x -= joystickData.x * speed;
                camera.position.z -= joystickData.y * speed;
            }

            // Boundaries
            camera.position.x = Math.max(-45, Math.min(45, camera.position.x));
            camera.position.z = Math.max(-45, Math.min(45, camera.position.z));

            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
  </html>
